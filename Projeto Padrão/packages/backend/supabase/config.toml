{
  "db": {
    "major_version": 15
  },
  "auth": {
    "enable_signup": true,
    "enable_email_confirmations": false,
    "enable_phone_confirmations": false,
    "enable_anonymous_sign_ins": false,
    "password_min_length": 8,
    "password_requirements": "{\"uppercase\": 1, \"lowercase\": 1, \"numbers\": 1, \"symbols\": 1}",
    "session_timebox": "24h",
    "jwt_exp": 604800
  },
  "api": {
    "port": 54321,
    "schemas": ["public"]
  },
  "studio": {
    "enabled": true,
    "port": 54323
  },
  "inbucket": {
    "enabled": true,
    "port": 54324,
    "smtp_port": 54325,
    "pop3_port": 54326
  },
  "storage": {
    "enabled": true,
    "file_size_limit": "50MiB"
  },
  "realtime": {
    "enabled": true,
    "port": 54322
  }
}